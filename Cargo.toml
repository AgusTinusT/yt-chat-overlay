[package]
name = "yt-chat-overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
ureq = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.6"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
