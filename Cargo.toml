[package]
name = "yt-chat-overlay"
version = "0.2.1"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = "0.29"
ureq = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.6"
tray-icon = "0.19"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

# Hanya untuk examples/make_icon.rs (membuat ikon dari assets/logo.svg)
[dev-dependencies]
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
