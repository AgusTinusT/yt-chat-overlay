# Push tag versi (mis. v0.1.0) -> GitHub build .exe untuk Windows dan membuat Release otomatis.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/yt-chat-overlay.exe dist/YT-Chat-Overlay.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "YT-Chat-Overlay-${{ github.ref_name }}-windows-x64.zip"

      - name: Checksum SHA-256 dan catatan rilis
        shell: pwsh
        run: |
          $files = @("dist/YT-Chat-Overlay.exe", "YT-Chat-Overlay-${{ github.ref_name }}-windows-x64.zip")
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, (Split-Path $_ -Leaf) }
          $sums | Set-Content -Encoding utf8 SHA256SUMS.txt
          $notes = @(
            "## Download"
            "Unduh **YT-Chat-Overlay.exe**, lalu langsung jalankan. Tidak perlu install (Windows 10/11)."
            ""
            "## Muncul peringatan saat dibuka?"
            "File ini **belum ditandatangani secara digital**, jadi Windows atau browser bisa menampilkan peringatan walaupun file-nya aman:"
            "- **Windows protected your PC** (layar biru): klik **More info**, lalu **Run anyway**."
            "- **Chrome/Edge memblokir download**: buka daftar download, lalu pilih **Keep** / **Keep anyway**."
            "- **Windows Defender menghapus file**: itu salah deteksi (*false positive*). Lihat bagian *Peringatan keamanan* di README."
            ""
            "Source code-nya terbuka, dan file ini dibuild otomatis oleh GitHub Actions dari kode di repo ini."
            ""
            "Lihat juga [Code signing policy](https://github.com/AgusTinusT/yt-chat-overlay#code-signing-policy) dan [Privacy](https://github.com/AgusTinusT/yt-chat-overlay#privacy)."
            ""
            "## Cek keaslian file (SHA-256)"
            '```'
            $sums
            '```'
            "Di PowerShell, jalankan ``Get-FileHash .\YT-Chat-Overlay.exe``. Kolom *Hash* harus sama persis dengan angka di atas."
          )
          $notes | Set-Content -Encoding utf8 RELEASE_NOTES.md

      # Paket untuk Microsoft Store. Bukan untuk diinstall langsung (belum ditandatangani);
      # unduh dari tab Actions > run ini > Artifacts, lalu upload ke Partner Center.
      - name: Paket MSIX (Microsoft Store)
        shell: pwsh
        run: ./packaging/build-msix.ps1 -Exe target/release/yt-chat-overlay.exe -OutDir msix

      - uses: actions/upload-artifact@v4
        with:
          name: msix-store-${{ github.ref_name }}
          path: msix/*.msix
          retention-days: 90

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/YT-Chat-Overlay.exe
            YT-Chat-Overlay-${{ github.ref_name }}-windows-x64.zip
            SHA256SUMS.txt
