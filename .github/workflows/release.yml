# Push tag versi (mis. v0.1.0) -> GitHub build .exe untuk Windows dan membuat Release otomatis.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/yt-chat-overlay.exe dist/YT-Chat-Overlay.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "YT-Chat-Overlay-${{ github.ref_name }}-windows-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/YT-Chat-Overlay.exe
            YT-Chat-Overlay-${{ github.ref_name }}-windows-x64.zip
